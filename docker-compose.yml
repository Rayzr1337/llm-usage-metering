services:
    api:
      container_name: llm-usage
      build: 
        context: .
        dockerfile: dockerfile
      restart: unless-stopped
      env_file:
        - .env
      environment:
        DATABASE_URL: postgres://postgres:dev@db:5432/llm_usage
        REDIS_URL: redis://redis:6379
      ports:
        - "${PORT}:${PORT}"
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
    db:
      image: postgres:17-alpine
      restart: unless-stopped
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: dev
        POSTGRES_DB: llm_usage
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d llm_usage"]
        interval: 5s
        timeout: 5s
        retries: 5

    redis:
      image: redis:8-alpine
      restart: unless-stopped

      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 5s
        retries: 5



volumes:
  pgdata: