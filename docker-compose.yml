services:
    db:
      image: postgres:17-alpine
      restart: unless-stopped
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: dev
        POSTGRES_DB: llm_usage
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d llm_usage"]
        interval: 5s
        timeout: 5s
        retries: 5


volumes:
  pgdata: